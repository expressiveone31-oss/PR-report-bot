# Railway build config (nixpacks).
# Нужно для генерации PNG-карточки (cairosvg → libcairo → шрифты).
#
# Используем aptPkgs (debian-пакеты), а не nixPkgs — с ними меньше сюрпризов
# и они работают "как в apt install" на обычном Ubuntu.
#
# Что зачем:
#   - libcairo2:         сама библиотека cairo, cairocffi ищет libcairo.so.2
#   - libcairo2-dev:     заголовки — нужны при установке cairocffi
#   - libpango-1.0-0:    рендер текста поверх cairo
#   - libpangocairo-1.0-0: связка pango + cairo для сложного текста
#   - libgdk-pixbuf-2.0-0: растровые изображения (транзитивная зависимость)
#   - libffi-dev:        cffi-биндинги cairo
#   - pkg-config:        нужен на этапе установки cairocffi
#   - fonts-dejavu-core: шрифт DejaVu с полной поддержкой кириллицы
#   - fontconfig:        поиск шрифтов в системе

[phases.setup]
aptPkgs = [
    "libcairo2",
    "libcairo2-dev",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libgdk-pixbuf-2.0-0",
    "libffi-dev",
    "pkg-config",
    "fonts-dejavu-core",
    "fontconfig",
]
